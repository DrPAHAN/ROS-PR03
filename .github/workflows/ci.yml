name: ROS PR03 checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: "6eda53e1c566f7f0a7e09d7afe1e5a6f3b98397175a7e57dede9a84c6d14d0fe"
  COURSE_KIT_SHA256: "12f03ad224f4f7801c4eeb320934b198fe0b9536d70f2f617894da08ca3bedba"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:abcdef123456789012345678901234567890123456789012345678901234abcd
    steps:
      - name: Prepare Node for checkout
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
          node --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build patrol
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select patrol

      - name: Test patrol
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          colcon test --packages-select patrol --event-handlers console_direct+
          colcon test-result --verbose

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf kit.tar.gz -C .course-kit

      - name: Check PR03 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR03 --submission .
